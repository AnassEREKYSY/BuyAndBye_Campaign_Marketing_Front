services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_BACKEND_BASE_URL: ${VITE_BACKEND_BASE_URL:-http://localhost:8000}
        VITE_APP_NAME: ${VITE_APP_NAME:-Buy & Bye}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
    ports:
      - "3000:80"
